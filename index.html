<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Elegant Notes</h1>
            <p>Store your thoughts and ideas in style</p>
        </header>

        <div class="controls">
            <div class="controls-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search notes..." 
                    class="search-input"
                />
                <div class="filter-group">
                    <select id="filterSelect" class="filter-select">
                        <option value="all">All notes</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="ideas">Ideas</option>
                        <option value="reminders">Reminders</option>
                    </select>
                    <button id="addNoteBtn" class="add-btn">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
            </div>
        </div>

        <div id="notesContainer" class="notes-grid">
            <!-- Notes will be added here dinamically -->
        </div>
        <div id="emptyState" class="empty-state">
            <i class="fas fa-notes-medical"></i>
            <h3>No Notes</h3>
            <p>Add your first note by clicking the "Add" button</p>
        </div>

        <div id="addNoteModal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3 class="modal-title">New note</h3>
                    <button class="closeModalBtn" class="modal-close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
